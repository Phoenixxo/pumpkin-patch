[workspace]
resolver = "3"
members = ["sdk", "ping", "trap", "spin", "hud-bench", "host-calls", "radar"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-only"

[workspace.dependencies]
wit-bindgen = { version = "0.62", default-features = false, features = ["macros", "realloc"] }
pumpkin-client-sdk = { path = "sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
